worker_processes 1;
events { worker_connections 1024; }

http {
  # The MLX engine runs NATIVELY on the macOS host (Metal/GPU).
  # Docker on macOS is a Linux VM with no Metal passthrough, so the engine
  # cannot live in a container. We reach it via the VM's host gateway.
  # -> the model ROUTER (:8090), not the engine (:8081) directly.
  # The engine is single-model and only ever reports the one build it has resident,
  # so pointing at it gives Open WebUI a dropdown with exactly one entry. The router
  # advertises both builds and swaps the engine on demand (~15-85s reload).
  upstream mlx_engine {
    server host.docker.internal:8090;
    keepalive 32;
  }

  # Long-context 27B generations are slow to first byte; do not time out.
  proxy_connect_timeout 60s;
  proxy_send_timeout    3600s;
  proxy_read_timeout    3600s;
  send_timeout          3600s;

  # 256K-token prompts are large.
  client_max_body_size  512m;
  client_body_buffer_size 1m;

  log_format bench '$remote_addr $request_method $uri status=$status '
                   'upstream_time=$upstream_response_time total=$request_time';
  access_log /var/log/nginx/access.log bench;

  server {
    listen 8080;

    location /healthz {
      access_log off;
      return 200 "gateway ok\n";
    }

    location / {
      proxy_pass http://mlx_engine;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header Connection        "";

      # Critical for SSE token streaming: never buffer, never chunk-collapse.
      proxy_buffering     off;
      proxy_cache         off;
      gzip                off;
      chunked_transfer_encoding on;
      proxy_set_header X-Accel-Buffering no;
    }
  }
}
